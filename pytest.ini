[pytest]
testpaths = tests
addopts = -q

# PuLP 3.x warns loudly about API changes coming in 4.0. requirements.txt pins
# below 4.0 precisely so those changes cannot land unexpectedly, so the warnings
# are noise here -- several thousand lines of it, which buries anything that
# actually matters.
filterwarnings =
    ignore::DeprecationWarning:pulp.*
